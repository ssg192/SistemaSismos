name: Notificar a Discord estilo Webhook

on:
  push:

jobs:
  discordNotification:
    runs-on: ubuntu-latest
    steps:
      - name: Construir mensaje
        id: build_msg
        run: |
          COMMIT_LIST=""
          for COMMIT in $(jq -r '.commits[].id' <<< '${{ toJson(github.event) }}'); do
            MESSAGE=$(jq -r ".commits[] | select(.id==\"$COMMIT\") | .message" <<< '${{ toJson(github.event) }}')
            URL=$(jq -r ".commits[] | select(.id==\"$COMMIT\") | .url" <<< '${{ toJson(github.event) }}')
            AUTHOR=$(jq -r ".commits[] | select(.id==\"$COMMIT\") | .author.name" <<< '${{ toJson(github.event) }}')
            SHORT_COMMIT=${COMMIT:0:7}
            COMMIT_LIST="$COMMIT_LIST\n[$SHORT_COMMIT]($URL): $MESSAGE – $AUTHOR"
          done

          echo "MESSAGE=👤 **${{ github.actor }}** pushed to **${{ github.ref_name }}** in **${{ github.repository }}**
          🔗 [Compare changes](${{ github.event.compare }})
          $COMMIT_LIST" >> $GITHUB_ENV

      - name: Enviar a Discord
        uses: Ilshidur/action-discord@master
        with:
          args: ${{ env.MESSAGE }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}


