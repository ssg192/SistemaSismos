name: Notificar a Discord estilo embed

on:
  pull_request:
    types: [closed]
  push:
    branches:
      - developer

jobs:
  discordNotification:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificación a Discord
        run: |
          # Variables del evento
          ACTOR="${GITHUB_ACTOR}"
          AVATAR="${GITHUB_EVENT_SENDER_AVATAR_URL}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Filtrar solo PR mergeado a developer
            if [ "${GITHUB_EVENT_PULL_REQUEST_MERGED}" != "true" ] || [ "${GITHUB_EVENT_PULL_REQUEST_BASE_REF}" != "developer" ]; then
              echo "No es un PR mergeado a developer, saliendo..."
              exit 0
            fi
            TYPE="PR mergeado"
            BRANCH="${GITHUB_EVENT_PULL_REQUEST_BASE_REF}"
            SOURCE_BRANCH="${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}"
            COMPARE_URL="${GITHUB_EVENT_PULL_REQUEST_HTML_URL}"
            TITLE="$TYPE: $BRANCH – [Repo]($REPO_URL)"
            DESCRIPTION="Mergeado desde $SOURCE_BRANCH por $ACTOR"

            # Listado de commits del PR
            COMMIT_FIELDS=$(curl -s "${GITHUB_EVENT_PULL_REQUEST_COMMITS_URL}" \
              | jq -c '.[] | {name: ("Commit " + .sha[0:7]), value: ("[" + .commit.message + "](" + .url + ") – " + .author.name), inline: false}' \
              | jq -s .)
          else
            # Push directo a developer
            TYPE="Push directo"
            BRANCH="${GITHUB_REF_NAME}"
            COMPARE_URL="${GITHUB_EVENT_COMPARE}"
            TITLE="$TYPE: $BRANCH – [Repo]($REPO_URL)"
            DESCRIPTION="Commits por $ACTOR"

            # Listado de commits del push
            COMMIT_FIELDS=$(jq -c '.commits[] | {name: ("Commit " + .id[0:7]), value: ("[" + .message + "](" + .url + ") – " + .author.name), inline: false}' <<< "${GITHUB_EVENT_PATH}" | jq -s .)
          fi

          # Crear payload JSON con embed y thumbnail del usuario
          jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg actor "$ACTOR" \
            --arg avatar "$AVATAR" \
            --arg compare "$COMPARE_URL" \
            --argjson fields "$COMMIT_FIELDS" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                url: $compare,
                color: 7506394,
                author: { name: $actor, icon_url: $avatar },
                thumbnail: { url: $avatar },
                fields: $fields,
                footer: { text: "GitHub Actions" }
              }]
            }' > payload.json

          # Enviar a Discord
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               ${{ secrets.DISCORD_WEBHOOK }}

